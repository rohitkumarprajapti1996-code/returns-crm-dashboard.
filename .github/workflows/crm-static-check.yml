name: CRM static checks

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  validate-inline-javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate inline JavaScript and CRM invariants
        run: node scripts/check-inline-js.cjs
